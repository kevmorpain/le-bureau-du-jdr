name: Deploy staging

# Déploie la PR courante sur l'environnement de staging PARTAGÉ : le Worker
# `le-bureau-du-jdr-staging`, avec sa propre D1 / KV / R2 (cf. le bloc `env.staging`
# de wrangler.jsonc). C'est ce qui donne une URL cliquable avant le merge — Workers
# Builds, lui, ne déploie que la branche par défaut.
#
# Partagé = la dernière PR poussée occupe l'environnement. C'est un choix assumé :
# docs/staging.md explique pourquoi une preview par PR serait disproportionnée ici
# (redirect URIs OAuth par domaine, coût du seed du catalogue par base).
#
# Prérequis de provisionnement (une seule fois) : docs/staging.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      seed:
        description: "Seeds à (re)jouer après déploiement, séparés par des virgules (ex. spells,items). Vide = aucun."
        required: false
        default: ""

# Un seul déploiement staging à la fois, toutes PR confondues — la cible est unique.
# Pas de `cancel-in-progress` : couper un run au milieu d'un `d1 migrations apply`
# laisserait la base dans un état partiel. Les runs font la queue.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → staging
    # Les secrets ne sont pas exposés aux PR issues d'un fork : inutile de tenter.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # commentaire d'URL sur la PR
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Requis par nuxt-auth-utils au boot du build (pas au runtime du Worker, qui lit
      # le vrai secret posé par `wrangler secret put --env staging -c wrangler.jsonc`).
      NUXT_SESSION_PASSWORD: ci_only_dummy_session_password_do_not_use
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `CLOUDFLARE_ENV` est posé ICI et NULLE PART AILLEURS. C'est au build que
      # @nuxthub/core aplatit `env.staging` de wrangler.jsonc dans le
      # .output/server/wrangler.json généré. Le config produit n'a donc plus de clé
      # `env` : les commandes wrangler qui suivent ne doivent surtout pas recevoir
      # `--env` (ni hériter de CLOUDFLARE_ENV), sinon elles cherchent un environnement
      # qui n'existe plus dans ce fichier.
      - name: Build (cible staging)
        run: npm run build
        env:
          CLOUDFLARE_ENV: staging

      # Garde-fou : si l'aplatissement n'a pas eu lieu, le Worker déployé porterait le
      # nom de production et ÉCRASERAIT LA PROD. On refuse de continuer.
      - name: Vérifier que le build cible bien le staging
        run: |
          set -euo pipefail
          name="$(node -p "require('./.output/server/wrangler.json').name")"
          echo "Worker ciblé : $name"
          [ "$name" = "le-bureau-du-jdr-staging" ] \
            || { echo "::error::le build ne cible pas le staging (name=$name) — déploiement annulé"; exit 1; }

      # D'abord le schéma, ensuite le code : les migrations du repo sont additives,
      # donc l'ancien Worker survit au court instant où il tourne sur le nouveau schéma.
      - name: Apply D1 migrations (staging)
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          if [ -z "$url" ]; then
            echo "::error::URL de déploiement introuvable dans la sortie de wrangler"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Staging déployé sur $url"

      # Optionnel et manuel (`workflow_dispatch`) : le catalogue vit dans la D1 de
      # staging et survit aux déploiements, donc le reseeder à chaque push serait du
      # gaspillage — et le seed complet dépasse la limite de requêtes D1 par invocation
      # (d'où le découpage `?only=`, cf. server/db/seeds/run.ts).
      - name: Seed (optionnel)
        if: github.event_name == 'workflow_dispatch' && inputs.seed != ''
        env:
          SEED_SECRET: ${{ secrets.STAGING_SEED_SECRET }}
          URL: ${{ steps.deploy.outputs.url }}
          # Passé par l'environnement, jamais interpolé dans le script : une entrée
          # `workflow_dispatch` inline dans un `run` serait une injection shell.
          SEEDS: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          for s in $(echo "$SEEDS" | tr ',' ' '); do
            echo "→ seed $s"
            response="$(curl -sf -X POST -H "x-seed-secret: ${SEED_SECRET}" \
              "${URL}/api/admin/seed?only=${s}")"
            echo "$response"
            grep -q '"result":"success"' <<<"$response" \
              || { echo "::error::seed $s en échec"; exit 1; }
          done

      - name: Commenter l'URL sur la PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            // Commentaire « collant » : on réédite le même au lieu d'en empiler un par push.
            const marker = '<!-- staging-url -->'
            const body = [
              marker,
              `🚀 **Staging** déployé : ${process.env.URL}`,
              '',
              `Commit \`${context.sha.slice(0, 7)}\` — environnement partagé, écrasé par la prochaine PR déployée.`,
            ].join('\n')

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find(c => c.body?.startsWith(marker))

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
